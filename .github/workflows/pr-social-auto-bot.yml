name: PR.SOCIAL Stealth IG Bot (24h/24 Eco-Quota)

on:
  workflow_dispatch:
  schedule:
    # Relais automatique toutes les 45 minutes, 24h/24 (00:00, 00:45, 01:30, 02:15, etc.)
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
    - cron: "45 0,3,6,9,12,15,18,21 * * *"
    - cron: "30 1,4,7,10,13,16,19,22 * * *"
    - cron: "15 2,5,8,11,14,17,20,23 * * *"

concurrency:
  group: pr-social-mono-account-samitodyignacegatien
  cancel-in-progress: false

jobs:
  run-stealth-ig-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 1. Recuperation du code du Bot Cloud
        uses: actions/checkout@v4

      - name: 2. Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 3. Installation du navigateur Chromium Furtif
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: 4. Restauration du compteur de taches
        uses: actions/cache/restore@v4
        with:
          path: data/bot_state.json
          key: pr-social-state-${{ github.sha }}
          restore-keys: |
            pr-social-state-

      - name: 5. Execution autonome du Bot (24h/24, Abonnements IG, Arret sur Pause 50 taches)
        env:
          SESSION_COOKIES_JSON: ${{ secrets.SESSION_COOKIES_JSON }}
          MAX_RUNTIME_MINUTES: "40"
          IG_WORKER_USERNAME: "samitodyignacegatien"
          PR_WORKER_USERNAME: "zonatody"
          TZ: "Indian/Antananarivo"
        run: node bot_cloud_runner.js

      - name: 6. Sauvegarde de l'etat pour le prochain reveil
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/bot_state.json
          key: pr-social-state-${{ github.sha }}-${{ github.job }}
